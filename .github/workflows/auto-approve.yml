# Every new (or edited) issue with a .zip attached is checked automatically and, if anything in it
# passes, added to packs/ + index.json — no manual approval. See tools/check_and_publish.py.
# The issue text is untrusted: it only reaches the script through environment variables.
name: Auto-approve contributions

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.issue.body, '.zip') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: pip install --quiet pillow numpy opencv-python-headless

      - name: Check and publish
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          set +e
          python tools/check_and_publish.py > report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Save to the collection
        if: steps.check.outputs.code == '0'
        run: |
          git config user.name "shared-references-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs index.json
          git commit -m "Add contribution #${{ github.event.issue.number }}"
          git pull --rebase
          git push

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          CODE: ${{ steps.check.outputs.code }}
        run: |
          if [ ! -s report.md ]; then echo "The check couldn't run — the owner has been notified by this failed run." > report.md; fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file report.md
          if [ "$CODE" = "0" ]; then
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
